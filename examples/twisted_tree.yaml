# Kalpana3D Example: Realistic Twisted Tree
# This scene uses capsules to build a tree with a proper branch structure.
# Domain warping is applied to add realistic, subtle noise, simulating bark.

type: smooth_union
k: 0.005  # Tighter blend for more defined branches

children:
  - type: domain_warp
    frequency: 0.8
    amplitude: 0.05
    child:
      type: smooth_union
      k: 0.005
      children:
        # Trunk
        - type: capsule
          start_point: [0, -1, 0]
          end_point: [0, 0.5, 0]
          radius: 0.2

        # Main Branch 1
        - type: capsule
          start_point: [0, 0.2, 0]
          end_point: [0.8, 1.2, 0.2]
          radius: 0.08

        # Sub-branch 1a
        - type: capsule
          start_point: [0.8, 1.2, 0.2]
          end_point: [1.2, 1.8, 0.3]
          radius: 0.04

        # Main Branch 2
        - type: capsule
          start_point: [0, 0.4, 0]
          end_point: [-0.6, 1.0, -0.3]
          radius: 0.06

        # Sub-branch 2a
        - type: capsule
          start_point: [-0.6, 1.0, -0.3]
          end_point: [-1.0, 1.5, -0.5]
          radius: 0.03

        # Sub-branch 2b
        - type: capsule
          start_point: [-0.6, 1.0, -0.3]
          end_point: [-0.8, 1.6, 0]
          radius: 0.02

        # Sub-branch 1b (New)
        - type: capsule
          start_point: [0.8, 1.2, 0.2]
          end_point: [1.0, 1.5, -0.1]
          radius: 0.03
